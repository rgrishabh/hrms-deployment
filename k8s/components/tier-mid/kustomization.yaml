# EKS, two availability zones, about 300 to 2,000 users. Base sizing plus Redis.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: { kind: HorizontalPodAutoscaler, name: hrms-backend }
    patch: |
      - { op: replace, path: /spec/minReplicas, value: 2 }
      - { op: replace, path: /spec/maxReplicas, value: 6 }
  - target: { kind: HorizontalPodAutoscaler, name: hrms-frontend }
    patch: |
      - { op: replace, path: /spec/minReplicas, value: 2 }
      - { op: replace, path: /spec/maxReplicas, value: 4 }
