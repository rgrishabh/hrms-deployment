# k3s has no IRSA here: these workloads reach AWS with the node role through IMDS. Only they may reach
# it; every other pod stays blocked by the default deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-egress-imds
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [hrms-backend, hrms-worker, hrms-migrate, hrms-freshclam-check]
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 169.254.169.254/32 }
      ports:
        - { protocol: TCP, port: 80 }
