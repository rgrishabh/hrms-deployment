# k3s has no IRSA here: backend and worker reach S3 and KMS with the node role through IMDS. Only these
# two workloads may reach it; every other pod stays blocked by the default deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-egress-imds
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [hrms-backend, hrms-worker]
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 169.254.169.254/32 }
      ports:
        - { protocol: TCP, port: 80 }
