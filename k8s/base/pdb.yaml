# maxUnavailable, not minAvailable: a single replica on tier-low must not block a node drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hrms-backend
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hrms-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hrms-frontend
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hrms-frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hrms-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hrms-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hrms-clamav
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hrms-clamav
