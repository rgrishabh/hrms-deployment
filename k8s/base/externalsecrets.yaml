# Terraform (modules/secrets) creates every remote secret named here. Each workload class gets its own
# Kubernetes Secret, so app pods never receive owner or superuser credentials.
#
#   hrms/infra                  non-sensitive Terraform outputs, as JSON
#   hrms/db-app-password        hrms_app, generated once, never in Terraform state
#   hrms/db-owner-password      hrms_owner, generated once, never in Terraform state
#   hrms/smtp-credentials       JSON with user and password; set by an operator
#   hrms/data-key-ciphertext    from scripts/generate-data-key.sh
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hrms-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "-13"
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws, kind: SecretStore }
  target:
    name: hrms-runtime
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://hrms_app:{{ .app_password | urlquery }}@{{ .db_host }}:{{ .db_port }}/hrms"
        DB_READ_HOST: "{{ .db_read_host }}"
        AWS_S3_BUCKET: "{{ .s3_bucket }}"
        AWS_REGION: "{{ .region }}"
        KMS_KEY_ID: "{{ .kms_key_id }}"
        DATA_KEY_CIPHERTEXT: "{{ .data_key_ciphertext }}"
        SMTP_USER: "{{ .smtp_user }}"
        SMTP_PASSWORD: "{{ .smtp_password }}"
  data:
    - { secretKey: app_password, remoteRef: { key: hrms/db-app-password } }
    - { secretKey: db_host, remoteRef: { key: hrms/infra, property: db_host } }
    - { secretKey: db_port, remoteRef: { key: hrms/infra, property: db_port } }
    - { secretKey: db_read_host, remoteRef: { key: hrms/infra, property: db_read_host } }
    - { secretKey: s3_bucket, remoteRef: { key: hrms/infra, property: s3_bucket } }
    - { secretKey: region, remoteRef: { key: hrms/infra, property: region } }
    - { secretKey: kms_key_id, remoteRef: { key: hrms/infra, property: kms_key_id } }
    - { secretKey: data_key_ciphertext, remoteRef: { key: hrms/data-key-ciphertext } }
    - { secretKey: smtp_user, remoteRef: { key: hrms/smtp-credentials, property: user } }
    - { secretKey: smtp_password, remoteRef: { key: hrms/smtp-credentials, property: password } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hrms-cache
  annotations:
    argocd.argoproj.io/sync-wave: "-13"
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws, kind: SecretStore }
  target:
    name: hrms-cache
    creationPolicy: Owner
  data:
    - { secretKey: REDIS_URL, remoteRef: { key: hrms/redis-url } }
---
# Migrate and bootstrap only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hrms-migration
  annotations:
    argocd.argoproj.io/sync-wave: "-13"
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws, kind: SecretStore }
  target:
    name: hrms-migration
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_MIGRATION_URL: "postgres://hrms_owner:{{ .owner_password | urlquery }}@{{ .db_host }}:{{ .db_port }}/hrms"
        BOOTSTRAP_ADMIN_EMAIL: "{{ .admin_email }}"
        BOOTSTRAP_ADMIN_NAME: "{{ .admin_name }}"
        BOOTSTRAP_ADMIN_PASSWORD: "{{ .admin_password }}"
  data:
    - { secretKey: owner_password, remoteRef: { key: hrms/db-owner-password } }
    - { secretKey: db_host, remoteRef: { key: hrms/infra, property: db_host } }
    - { secretKey: db_port, remoteRef: { key: hrms/infra, property: db_port } }
    - { secretKey: admin_email, remoteRef: { key: hrms/infra, property: admin_email } }
    - { secretKey: admin_name, remoteRef: { key: hrms/infra, property: admin_name } }
    - { secretKey: admin_password, remoteRef: { key: hrms/bootstrap-admin-password } }
---
# Provision only. Holds the database master credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hrms-provision
  annotations:
    argocd.argoproj.io/sync-wave: "-13"
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws, kind: SecretStore }
  target:
    name: hrms-provision
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_HOST: "{{ .db_host }}"
        DB_PORT: "{{ .db_port }}"
        DB_NAME: hrms
        DB_ADMIN_USER: "{{ .master_username }}"
        DB_ADMIN_PASSWORD: "{{ .master_password }}"
        DB_OWNER_PASSWORD: "{{ .owner_password }}"
        DB_APP_PASSWORD: "{{ .app_password }}"
  data:
    - { secretKey: db_host, remoteRef: { key: hrms/infra, property: db_host } }
    - { secretKey: db_port, remoteRef: { key: hrms/infra, property: db_port } }
    - { secretKey: owner_password, remoteRef: { key: hrms/db-owner-password } }
    - { secretKey: app_password, remoteRef: { key: hrms/db-app-password } }
    # The name RDS gives its managed master secret. Set by the overlay from a Terraform output.
    - { secretKey: master_username, remoteRef: { key: REPLACE_RDS_MASTER_SECRET_NAME, property: username } }
    - { secretKey: master_password, remoteRef: { key: REPLACE_RDS_MASTER_SECRET_NAME, property: password } }
