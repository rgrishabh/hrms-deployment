# Is freshclam still updating? clamd reports the date of its signatures. Each hour this publishes their
# age to CloudWatch, where terraform/modules/monitoring alarms on an old value and on no value at all,
# so the alarm also covers this job failing. Uses the image's bash for the TCP connection.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hrms-freshclam-check
  labels:
    app.kubernetes.io/name: hrms-freshclam-check
spec:
  schedule: "15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hrms-freshclam-check
        spec:
          restartPolicy: Never
          serviceAccountName: hrms-freshclam-check
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: check
              image: amazon/aws-cli:2.39.3@sha256:d557b3524475d70dd3104cf44d96568ee3188897b73a6ece2b37aa50e1af362f
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  exec 3<>/dev/tcp/clamav/3310
                  printf 'zVERSION\0' >&3
                  version=$(tr -d '\0' <&3)
                  echo "$version"
                  age=$(( ($(date -u +%s) - $(date -u -d "${version##*/}" +%s)) / 3600 ))
                  aws cloudwatch put-metric-data --namespace HRMS --metric-name ClamavSignatureAgeHours --value "$age" --unit Count
              env:
                - { name: HOME, value: /tmp }
                - name: AWS_REGION
                  valueFrom:
                    secretKeyRef: { name: hrms-data-key, key: AWS_REGION }
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { cpu: 250m, memory: 192Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tmp
              emptyDir: { sizeLimit: 64Mi }
