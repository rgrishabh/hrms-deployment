# Tokens are never mounted automatically: nothing here talks to the Kubernetes API. The IRSA webhook
# adds its own projected token on EKS. On k3s the annotations do nothing (DECISIONS.md, ADR-005).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hrms-backend
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/hrms-backend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hrms-worker
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/hrms-worker
automountServiceAccountToken: false
---
