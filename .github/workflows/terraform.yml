name: Terraform
# PR: fmt, tflint, validate, module tests (mocked providers), then a read-only plan per enabled
# customer (role hrms-terraform-plan, -refresh=false -lock=false) commented on the PR.
# Merge to main: apply per customer in GitHub Environment infra-<slug> (role hrms-terraform).
on:
  pull_request:
    paths: ["terraform/**", "environments/prod/customers.json", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", "environments/prod/customers.json"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      customers: ${{ steps.c.outputs.customers }}
      any: ${{ steps.c.outputs.any }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@ae78205cfffec9e8d93fd2b3115c7e9d3166d4b6 # v5.0.0
      - run: terraform fmt -check -recursive terraform
      - name: tflint
        run: |
          tflint --init --config "$PWD/terraform/.tflint.hcl"
          for d in terraform/modules/* terraform/envs/*; do echo "== $d"; tflint --chdir "$d" --config "$PWD/terraform/.tflint.hcl"; done
      - name: validate
        run: for d in terraform/modules/* terraform/envs/*; do terraform -chdir="$d" init -backend=false -no-color >/dev/null && terraform -chdir="$d" validate -no-color; done
      - name: module tests (mock providers)
        run: terraform -chdir=terraform/modules/hrms-stack test -no-color
      - id: c
        run: |
          c=$(jq -c '[.customers[] | select(.enabled == true)]' environments/prod/customers.json)
          c=$(jq -c '[.[] | select(.slug as $s | $s | test("^[a-z0-9-]+$"))]' <<<"$c")
          echo "customers=$c" >> "$GITHUB_OUTPUT"; echo "any=$([ "$c" = "[]" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

  plan:
    needs: static
    if: github.event_name == 'pull_request' && needs.static.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        customer: ${{ fromJSON(needs.static.outputs.customers) }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::${{ matrix.customer.account_id }}:role/hrms-terraform-plan
          aws-region: ${{ matrix.customer.region }}
      - name: plan
        id: plan
        env:
          SLUG: ${{ matrix.customer.slug }}
        run: |
          cd terraform/envs/customer
          terraform init -no-color -reconfigure -backend-config="../../customers/$SLUG.backend.hcl" >/dev/null
          set +e
          terraform plan -no-color -refresh=false -lock=false -detailed-exitcode -var-file="../../customers/$SLUG.tfvars" -out=tfplan > plan.txt 2>&1
          code=$?; set -e
          tail -c 50000 plan.txt > "$RUNNER_TEMP/plan.txt"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -ne 1 ] || { cat plan.txt; exit 1; }
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SLUG: ${{ matrix.customer.slug }}
          CODE: ${{ steps.plan.outputs.code }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(`${process.env.RUNNER_TEMP}/plan.txt`, 'utf8');
            const summary = (plan.match(/^Plan: .*$/m) || plan.match(/No changes\..*$/m) || ['(see run)'])[0];
            const marker = `<!-- tf-plan:${process.env.SLUG} -->`;
            const body = `${marker}\n### Terraform plan: \`${process.env.SLUG}\`\n**${summary}**\n<details><summary>Plan output</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { data } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const mine = data.find((c) => c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  apply:
    needs: static
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.static.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        customer: ${{ fromJSON(needs.static.outputs.customers) }}
    environment:
      name: infra-${{ matrix.customer.slug }}
    concurrency:
      group: terraform-apply-${{ matrix.customer.slug }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::${{ matrix.customer.account_id }}:role/hrms-terraform
          aws-region: ${{ matrix.customer.region }}
      - name: apply
        env:
          SLUG: ${{ matrix.customer.slug }}
        run: |
          cd terraform/envs/customer
          terraform init -no-color -reconfigure -backend-config="../../customers/$SLUG.backend.hcl" >/dev/null
          terraform plan -no-color -var-file="../../customers/$SLUG.tfvars" -out=tfplan | tee plan.txt | tail -40
          terraform apply -no-color -auto-approve tfplan | tail -40
          { echo "### Terraform apply: $SLUG"; grep -E '^(Plan:|No changes)' plan.txt || true; } >> "$GITHUB_STEP_SUMMARY"
