name: Release

# One image, every account, same order every time:
#   build (Shared Services ECR) -> staging -> canary customers -> all other customers
# Each account is reached through its own hrms-release role (GitHub OIDC; no stored keys).
# Configure GitHub environments: `staging` (no approval) and `production` (required reviewers).
# Repository variable SHARED_ACCOUNT_ID = Shared Services account id.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Commit to release (default: latest main)"
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      staging: ${{ steps.targets.outputs.staging }}
      canary: ${{ steps.targets.outputs.canary }}
      rest: ${{ steps.targets.outputs.rest }}
      has_canary: ${{ steps.targets.outputs.has_canary }}
      has_rest: ${{ steps.targets.outputs.has_rest }}
    steps:
      - id: sha
        run: echo "sha=${{ inputs.git_sha || github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
      - id: targets
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          reg = json.load(open("infra/customers/customers.json"))
          customers = [c for c in reg["customers"] if not c.get("paused")]
          canary = [c for c in customers if c.get("canary")]
          rest = [c for c in customers if not c.get("canary")]
          print("staging=" + json.dumps(reg["staging"]))
          print("canary=" + json.dumps(canary))
          print("rest=" + json.dumps(rest))
          print("has_canary=" + str(bool(canary)).lower())
          print("has_rest=" + str(bool(rest)).lower())
          PY

  build:
    needs: plan
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.SHARED_ACCOUNT_ID }}:role/hrms-image-build
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: push
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/hrms-api
          TAG: ${{ needs.plan.outputs.sha }}
        run: |
          IMAGE="$REPO:$TAG"
          # Tags are immutable: rebuild only if this commit has no image yet.
          if aws ecr describe-images --repository-name hrms-api --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "image exists: $IMAGE"
          else
            docker build -f apps/api/Dockerfile -t "$IMAGE" .
            docker push "$IMAGE"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Block on critical vulnerabilities
        run: |
          aws ecr wait image-scan-complete --repository-name hrms-api --image-id imageTag=${{ needs.plan.outputs.sha }}
          CRIT=$(aws ecr describe-image-scan-findings --repository-name hrms-api --image-id imageTag=${{ needs.plan.outputs.sha }} \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text)
          if [ "$CRIT" != "None" ] && [ "$CRIT" != "0" ]; then echo "::error::$CRIT critical vulnerabilities in image"; exit 1; fi

  staging:
    needs: [plan, build]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ fromJSON(needs.plan.outputs.staging).account_id }}:role/hrms-release
          aws-region: ${{ fromJSON(needs.plan.outputs.staging).region }}
      - run: scripts/deploy/release.sh "${{ needs.build.outputs.image }}"
        env:
          SKIP_SNAPSHOT: "true"

  canary:
    needs: [plan, build, staging]
    if: needs.plan.outputs.has_canary == 'true'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        customer: ${{ fromJSON(needs.plan.outputs.canary) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ matrix.customer.account_id }}:role/hrms-release
          aws-region: ${{ matrix.customer.region }}
      - run: scripts/deploy/release.sh "${{ needs.build.outputs.image }}"

  rollout:
    needs: [plan, build, staging, canary]
    if: always() && needs.plan.outputs.has_rest == 'true' && needs.staging.result == 'success' && (needs.canary.result == 'success' || needs.canary.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        customer: ${{ fromJSON(needs.plan.outputs.rest) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ matrix.customer.account_id }}:role/hrms-release
          aws-region: ${{ matrix.customer.region }}
      - run: scripts/deploy/release.sh "${{ needs.build.outputs.image }}"
