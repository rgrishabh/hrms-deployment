name: Rollback prod
# One click: pin a customer's PREVIOUS versions (or given tags) in the client's repository, for Argo CD to
# apply. Needs the prod-<slug> approval. Records the result in environments/prod/<slug>/versions.env so
# git matches production.
#
# This does not change the schema. It cannot: the down files are in the image being left, and the pipeline
# has no access to the cluster. Before running this for a release whose migrations the older image cannot
# work with, run scripts/k8s-ops-job.sh migrate-down from the cluster (docs/RUNBOOK.md, Roll back).
on:
  workflow_dispatch:
    inputs:
      customer:
        description: Customer slug
        required: true
      schema:
        description: Type "compatible" if the older image runs on the current schema, or migrate-down has already run
        required: true
      backend_tag:
        description: "Backend vX.Y.Z (empty = the previous value in git history)"
        required: false
      frontend_tag:
        description: "Frontend vX.Y.Z (empty = the previous value in git history)"
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-prod-${{ inputs.customer }}
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: prod-${{ inputs.customer }}
    permissions:
      contents: write
      packages: read
    env:
      SLUG: ${{ inputs.customer }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false   # pushes use the bot token; a persisted GITHUB_TOKEN header would override it
      - id: bot
        uses: ./.github/actions/bot-token
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          pat: ${{ secrets.DEPLOY_REPO_TOKEN }}
          fallback: ${{ github.token }}
      - name: Resolve target versions
        id: t
        env:
          IN_B: ${{ inputs.backend_tag }}
          IN_F: ${{ inputs.frontend_tag }}
          SCHEMA: ${{ inputs.schema }}
        run: |
          [ "$SCHEMA" = compatible ] || { echo "::error::read docs/RUNBOOK.md, Roll back, then type: compatible"; exit 1; }
          [[ "$SLUG" =~ ^[a-z0-9-]+$ ]] || { echo "::error::bad slug"; exit 1; }
          f="environments/prod/$SLUG/versions.env"
          c=$(jq -c --arg s "$SLUG" '.customers[] | select(.slug == $s)' environments/prod/customers.json)
          [ -n "$c" ] || { echo "::error::$SLUG not in customers.json"; exit 1; }
          get() { grep -E "^$1=" | cut -d= -f2; }
          cur_b=$(get BACKEND_TAG < "$f"); cur_f=$(get FRONTEND_TAG < "$f")
          # previous distinct value of each tag in history
          prev() { git log --format=%H -- "$f" | while read -r h; do v=$(git show "$h:$f" | get "$1"); [ "$v" != "$2" ] && { echo "$v"; break; }; done; }
          b=${IN_B:-$(prev BACKEND_TAG "$cur_b")}; fr=${IN_F:-$(prev FRONTEND_TAG "$cur_f")}
          b=${b:-$cur_b}; fr=${fr:-$cur_f}
          for t in "$b" "$fr"; do [[ "$t" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$t' is not vX.Y.Z"; exit 1; }; done
          owner=${OWNER,,}
          {
            echo "domain=$(jq -r .domain <<<"$c")"; echo "repo=$(jq -r .gitops_repo <<<"$c")"; echo "overlay=$(jq -r '.overlay // "overlay"' <<<"$c")"
            echo "backend_tag=$b"; echo "frontend_tag=$fr"
            echo "backend=ghcr.io/$owner/hrms-backend:$b"; echo "frontend=ghcr.io/$owner/hrms-frontend:$fr"
          } >> "$GITHUB_OUTPUT"
          echo "### Rollback $SLUG: backend $cur_b → $b, frontend $cur_f → $fr" >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Verify signatures and read digests
        id: verify
        env:
          GHCR_USER: ${{ secrets.GHCR_PULL_TOKEN && vars.GHCR_PULL_USER || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || github.token }}
          BACKEND: ${{ steps.t.outputs.backend }}
          FRONTEND: ${{ steps.t.outputs.frontend }}
          BACKEND_TAG: ${{ steps.t.outputs.backend_tag }}
        run: |
          printf '%s' "$GHCR_TOKEN" | cosign login ghcr.io -u "$GHCR_USER" --password-stdin
          verify() {
            cosign verify "$1" --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^https://github.com/$OWNER/hrms-deployment/\.github/workflows/_app-publish\.yml@refs/heads/main$" \
              --certificate-github-workflow-repository "$OWNER/hrms-$2" | jq -r '.[0].critical.image."docker-manifest-digest"'
          }
          bd=$(verify "$BACKEND" backend); fd=$(verify "$FRONTEND" frontend)
          [[ "$bd" == sha256:* && "$fd" == sha256:* ]] || { echo "::error::signature verification failed"; exit 1; }
          # The id deploy-prod gave this pair of images. Its Jobs were pruned, so they run again; provision
          # and migrate are idempotent, and migrate ignores applied migrations it does not ship.
          release="${BACKEND_TAG#v}.$(printf '%s%s' "$bd" "$fd" | sha256sum | cut -c1-7)"
          { echo "backend=$bd"; echo "frontend=$fd"; echo "release=$release"; } >> "$GITHUB_OUTPUT"
      - name: Check out the client's repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ steps.t.outputs.repo }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: client
          fetch-depth: 0
      - name: Pin the older release
        env:
          OVERLAY: ${{ steps.t.outputs.overlay }}
          BACKEND: ${{ steps.verify.outputs.backend }}
          FRONTEND: ${{ steps.verify.outputs.frontend }}
          RELEASE: ${{ steps.verify.outputs.release }}
        run: scripts/gitops-release.sh client "$OVERLAY" "$BACKEND" "$FRONTEND" "$RELEASE" "rollback to $RELEASE [by $GITHUB_ACTOR]"
      - name: Wait for the rollout, then smoke test
        env:
          DOMAIN: ${{ steps.t.outputs.domain }}
          BACKEND_TAG: ${{ steps.t.outputs.backend_tag }}
          FRONTEND_TAG: ${{ steps.t.outputs.frontend_tag }}
        run: scripts/k8s-wait-release.sh "https://$DOMAIN" "$BACKEND_TAG" "$FRONTEND_TAG"
      - name: Record in git
        env:
          B: ${{ steps.t.outputs.backend_tag }}
          F: ${{ steps.t.outputs.frontend_tag }}
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          f="environments/prod/$SLUG/versions.env"
          sed -i -E -e "s#^BACKEND_TAG=.*#BACKEND_TAG=$B#" -e "s#^FRONTEND_TAG=.*#FRONTEND_TAG=$F#" "$f"
          git diff --quiet -- "$f" && exit 0
          git remote set-url origin "https://x-access-token:$BOT_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git config user.name "hrms-deploy-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "revert(prod/$SLUG): rollback to backend $B, frontend $F [skip ci]" -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID by $GITHUB_ACTOR" -- "$f"
          pushed=0; for i in 1 2 3; do if git push origin HEAD:main; then pushed=1; break; fi; git pull --rebase -q origin main; sleep $((i * 3)); done; [ "$pushed" = 1 ] || { echo "::error::could not push to main (token lacks bypass of the main ruleset?)"; exit 1; }
