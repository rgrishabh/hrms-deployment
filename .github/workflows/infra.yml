name: Infrastructure

# Pull request: fmt + validate everything, then a read-only plan for every account.
# Merge to main: plan + apply per account, gated by the GitHub environment
# `infra-<slug>` (configure required reviewers). Manual run: one account.
# Repository variable SHARED_ACCOUNT_ID must be set.

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:
    inputs:
      customer:
        description: "Customer slug (or 'staging')"
        required: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.16.6"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive infra
      - name: Validate every module and root
        run: |
          for d in infra/modules/* infra/live/*; do
            echo "== $d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done
      - name: Module tests (mock providers, no AWS credentials)
        run: terraform -chdir=infra/modules/hrms-stack test

  targets:
    needs: static
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.t.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        env:
          ONLY: ${{ inputs.customer }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          reg = json.load(open("infra/customers/customers.json"))
          targets = [reg["staging"]] + reg["customers"]
          only = os.environ.get("ONLY")
          if only:
              targets = [t for t in targets if t["slug"] == only]
              if not targets: raise SystemExit(f"unknown customer {only}")
          print("matrix=" + json.dumps([{"slug": t["slug"], "account_id": t["account_id"], "region": t["region"]} for t in targets]))
          PY

  plan:
    if: github.event_name == 'pull_request'
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ matrix.target.account_id }}:role/hrms-terraform-plan
          aws-region: ${{ matrix.target.region }}
      - name: Plan (read-only, no refresh, no lock)
        working-directory: infra/live/customer
        run: |
          terraform init -input=false -reconfigure -backend-config=../../customers/${{ matrix.target.slug }}.backend.hcl
          terraform plan -input=false -lock=false -refresh=false -no-color \
            -var-file=../../customers/${{ matrix.target.slug }}.tfvars | tee plan.txt
          { echo "### Plan: ${{ matrix.target.slug }}"; echo '```'; tail -c 60000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name != 'pull_request'
    needs: targets
    runs-on: ubuntu-latest
    environment: infra-${{ matrix.target.slug }}
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ matrix.target.account_id }}:role/hrms-terraform
          aws-region: ${{ matrix.target.region }}
      - name: Plan and apply
        working-directory: infra/live/customer
        run: |
          terraform init -input=false -reconfigure -backend-config=../../customers/${{ matrix.target.slug }}.backend.hcl
          terraform plan -input=false -no-color -out=tfplan -var-file=../../customers/${{ matrix.target.slug }}.tfvars
          terraform apply -input=false -no-color tfplan
