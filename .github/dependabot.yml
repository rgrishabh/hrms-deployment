version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/bot-token"]
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
  - package-ecosystem: terraform
    directories: ["/terraform/envs/customer", "/terraform/envs/organization", "/terraform/envs/shared-services"]
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(terraform)" }
  - package-ecosystem: docker-compose
    directory: /environments/dev
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(dev)" }
