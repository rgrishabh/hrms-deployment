version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/bot-token"]
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
  - package-ecosystem: terraform
    directories: ["/terraform/envs/customer", "/terraform/envs/organization", "/terraform/envs/shared-services", "/terraform/envs/prod-low", "/terraform/envs/prod-mid", "/terraform/envs/prod-high"]
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(terraform)" }
  - package-ecosystem: docker-compose
    directories: ["/environments/dev", "/dev"]
    schedule: { interval: weekly }
    ignore:
      # A PostgreSQL major upgrade needs dump/restore (pg_upgrade) of the data volume: do it deliberately.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "chore(dev)" }
